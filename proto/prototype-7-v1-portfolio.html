<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — V1 Mechanics Portfolio</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="group.css"><link rel="stylesheet" href="platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">V1 PORTFOLIO</div><span class="badge">24 MECHANICS</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП 07 · ANALYST DESK</div><h1>Индикатор — линза, не команда.</h1><p>24 механики, лестница источников и три слота: trend filter, trigger, risk measure.</p></div><div class="search"><label class="sr-only" for="portfolioSearch">Найти механику</label><input id="portfolioSearch" type="text" placeholder="Найти механику или M-код"></div><div class="toolbar"><span class="count" id="portfolioCount"></span></div><div class="tabs"><button class="tab active" data-group="all">Все</button><button class="tab" data-group="QUIZ">Quiz</button><button class="tab" data-group="APPLY">Apply</button><button class="tab" data-group="RISK">Risk</button><button class="tab" data-group="INTEGRATE">Integrate</button></div><div class="menu-grid" id="portfolio"></div><div class="hero"><div class="eyebrow">INDICATOR LENSES</div><h1>Три разные роли</h1></div><div class="grid" id="lenses"><button class="source" data-role="trend"><b>EMA 50</b><small>Trend filter</small></button><button class="source" data-role="trigger"><b>RSI</b><small>Trigger</small></button><button class="source" data-role="risk"><b>ATR</b><small>Risk measure</small></button><button class="source" data-role="trigger"><b>Stochastic</b><small>Duplicate trigger</small></button></div><div class="grid" id="slots"><div class="slot" data-slot="trend">Trend filter</div><div class="slot" data-slot="trigger">Trigger</div><div class="slot" data-slot="risk">Risk measure</div></div><div class="card"><div class="label">SOURCE LADDER</div><div class="row"><span>A–B</span><b>1–2</b></div><div class="row"><span>C–E</span><b>2–3</b></div><div class="row"><span>F–J</span><b>3–5</b></div></div></section></main><script src="shared.js"></script><script>
const m=['M01 Квиз 2.0|QUIZ','M02 Спид-раунд|QUIZ','M03 Пары и глоссарий|QUIZ','M04 Собери процедуру|APPLY','M05 Бык/Медведь свайп|APPLY','M06 Сортировка корзин|APPLY','M07 Охота на паттерн|APPLY','M08 Разметка зон S/R|APPLY','M09 Конструктор свечи|APPLY','M10 График-пазл|APPLY','M11 Оцени индикатор|APPLY','M12 Риск-менеджер|RISK','M13 PnL-спринт|RISK','M14 Лимитная лесенка|RISK','M15 Лестница плеча|RISK','M16 Прогноз + Brier|QUIZ','M17 Выше/Ниже разведка|QUIZ','M18 Analyst Desk|INTEGRATE','M19 Реплей рынка|INTEGRATE','M20 Стакан и лента|INTEGRATE','M21 Сценарный дрилл|INTEGRATE','M22 Босс-бой|INTEGRATE','M23 PvP / Boss Rush|INTEGRATE','M24 Журнал + Post-Mortem|INTEGRATE'].map(x=>{let [n,g]=x.split('|');return{name:n,code:n.split(' ')[0],group:g}});let group='all',query='';function draw(){let rows=m.filter(x=>(group==='all'||x.group===group)&&(!query||x.name.toLowerCase().includes(query)));portfolioCount.textContent=rows.length+' из '+m.length;portfolio.innerHTML=rows.length?rows.map(x=>`<button class="mechanic" data-code="${x.code}"><small>${x.group}</small><b>${x.name}</b><small>Открыть изолированное задание →</small></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Нет совпадений</div>';portfolio.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>location.href='lab/portfolio24/'+b.dataset.code.toLowerCase()+'/')}portfolioSearch.oninput=()=>{query=portfolioSearch.value.trim().toLowerCase();draw()};document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-group]').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;draw()});let equipped={};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let r=b.dataset.role,name=b.querySelector('b').textContent;document.querySelectorAll('[data-role="'+r+'"]').forEach(x=>x.classList.remove('selected'));equipped[r]=name;b.classList.add('selected');let s=document.querySelector('[data-slot="'+r+'"]');s.classList.add('filled');s.innerHTML=`<b>${name}</b><small>${r} · нажмите другую линзу для замены</small>`;SA.toast(name+' установлена')});draw();
</script><script src="platform/route-registry.js"></script><script src="platform/arena-audit.js"></script><script src="platform/arena-platform.js"></script></body></html>
