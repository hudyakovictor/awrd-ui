<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena QA</title><link rel="stylesheet" href="shared.css"><body><main class="shell"><section class="screen"><div class="top"><div class="brand">RUNTIME QA</div><span class="badge" id="summary">RUNNING</span></div><div class="hero"><div class="eyebrow">DETERMINISTIC TEST SUITE</div><h1>Контракты данных и обучения</h1><p>Проверка канона, mastery, SRS, risk, DQI, Entities, replay и analytics.</p></div><div id="tests"></div><a class="secondary" style="display:grid;place-items:center;text-decoration:none" href="index.html">← К прототипам</a></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script>const out=[];function t(name,fn){try{if(fn()===false)throw Error('false');out.push([1,name])}catch(e){out.push([0,name+': '+e.message])}}const E=SA_ENGINE,p=E.initialPlayer(),s=p.cards['Evidence Only'];t('40 canonical cards',()=>SA_DATA.cards.length===40);t('40 canonical entities',()=>SA_DATA.entities.length===40);t('36 mechanics addressable',()=>SA_DATA.mechanics.length===36);t('unique card names',()=>new Set(SA_DATA.cards).size===40);t('unique entity names',()=>new Set(SA_DATA.entities).size===40);t('initial state valid',()=>Object.keys(p.cards).length===40);t('new card uses plain copy',()=>E.termLevel(s)==='plain');t('mastery rejects one answer',()=>!E.mastered(E.updateCard(s,{correct:true,application:true,transfer:true,explanation:1,confidence:1})));t('mastery thresholds exact',()=>E.mastered({...s,recognition:.85,application:.8,transfer:.75,explanation:.75,stability:.9,criticalRiskError:false}));t('critical risk blocks mastery',()=>!E.mastered({...s,recognition:1,application:1,transfer:1,explanation:1,stability:1,criticalRiskError:true}));t('review intervals canonical',()=>E.intervals.join(',')==='1,3,7,16,35');t('knowledge gap routing',()=>E.gap(s)==='knowledge gap');t('discipline gap routing',()=>E.gap(s,{riskError:true})==='discipline gap');t('emotional gap has no battle',()=>E.practiceFor('emotional gap').includes('no battle'));t('replay deterministic',()=>JSON.stringify(E.candles(7))===JSON.stringify(E.candles(7)));t('different seed differs',()=>JSON.stringify(E.candles(7))!==JSON.stringify(E.candles(8)));t('risk geometry valid',()=>E.riskSize({deposit:10000,riskPct:1,entry:100,stop:98}).size===50);t('risk cap rejects >5%',()=>!E.riskSize({deposit:10000,riskPct:6,entry:100,stop:98}).ok);t('lucky outcome cannot erase risk error',()=>E.dqi({decision:100,protocol:100,evidence:100,followup:100,risk:100,invalidation:100,discipline:100,resistance:100,riskError:true})===65);t('no-trade can score 100',()=>E.dqi({decision:100,protocol:100,evidence:100,followup:100,risk:100,invalidation:100,discipline:100,resistance:100})===100);t('Tier I has no hint',()=>E.entityEncounter(0,'one').showHint===false);t('Tier II has conflict',()=>E.entityEncounter(0,'two').sources.length===2);t('Tier III has 4 sources',()=>E.entityEncounter(0,'three').sources.length===4);t('all Tier I noHint',()=>SA_DATA.entityDefs.every(e=>e.tiers.one.noHint));t('chest is not a skill card',()=>!SA_DATA.cards.some(x=>/chest/i.test(x)));t('indicator wording has no buy/sell',()=>!SA_DATA.mechanics.find(x=>x.id==='M10').why.match(/buy|sell/i));t('analytics schema rejects empty',()=>!E.validateEvent({}));let ev={eventId:'1',playerId:'p',scenarioId:'s',level:1,chapter:'A',cardIds:[],phase:'act',latencyMs:1,hintsUsed:0,timestamp:new Date().toISOString()};t('analytics schema accepts contract',()=>E.validateEvent(ev));t('card update schedules review',()=>!!E.updateCard(s,{correct:true}).nextReviewAt);t('stability bounded',()=>E.updateCard({...s,stability:2},{correct:true}).stability<=1);tests.innerHTML=out.map(x=>`<div class="card ${x[0]?'good':'bad'}"><b>${x[0]?'✓':'✕'} ${x[1]}</b></div>`).join('');let pass=out.filter(x=>x[0]).length;summary.textContent=`${pass}/${out.length} PASS`;summary.style.color=pass===out.length?'var(--accent)':'var(--danger)';</script></body></html>
