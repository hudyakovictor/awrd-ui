<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — V3 Five Layers</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="group.css"><link rel="stylesheet" href="platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">V3 FINAL PORTFOLIO</div><span class="badge">33 UNITS</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП 05 · FIVE LAYERS</div><h1>Рост сложности — решения, не спешка.</h1><p>Decision Workspace растёт от 1–2 до 5–7 решений. Источники добавляются медленнее.</p></div><div class="tabs"><button class="tab active" data-stage="AB">A–B</button><button class="tab" data-stage="CE">C–E</button><button class="tab" data-stage="FH">F–H</button><button class="tab" data-stage="IJ">I–J</button></div><div class="card"><div class="label">SESSION PORTFOLIO</div><div class="allocation" id="allocation"></div><div class="row meta"><span>A Workspace</span><span>B Drills</span><span>C Mastery</span><span>D Meta</span><span>E Campaigns</span></div></div><div class="layer-grid"><button class="layer-btn active" data-layer="A">A<br><small>Core</small></button><button class="layer-btn" data-layer="B">B<br><small>Drills</small></button><button class="layer-btn" data-layer="C">C<br><small>Mastery</small></button><button class="layer-btn" data-layer="D">D<br><small>Meta</small></button><button class="layer-btn" data-layer="E">E<br><small>World</small></button></div><div id="units"></div></section></main><script src="shared.js"></script><script>
const layers={A:['Decision Workspace','In-Position Workspace','Risk First','Evidence Only','Noise Quarantine','No Trade','Preserve System','Confidence Check'],B:['Quiz 2.0','Indicator Read','Pattern Spot','Risk Architect','News Impact','Sequencer','Scam Hunter','Estimate','Pairs / Baskets','Candle Builder','S/R Zones','PnL Math'],C:['Entity Battle','Taming Series','Card Storm','Shadow Duel','Market Lightning','Cascade Combo'],D:['Journal + Post-Mortem','Backtest Marathon','Rust / Re-attestation','Watcher Chest'],E:['Crisis Campaigns','Same-seed Tournaments','Force Majeure']};const mix={AB:[20,55,10,15,0],CE:[30,40,15,10,5],FH:[40,30,15,10,5],IJ:[45,20,15,10,10]};let layer='A',stage='AB';function renderMix(){allocation.innerHTML=mix[stage].map((w,i)=>`<i class="alloc-${'abcde'[i]}" style="width:${w}%" title="${w}%"></i>`).join('')}function render(){units.innerHTML=`<div class="hero"><div class="eyebrow">LAYER ${layer}</div><h1>${['Core Workspace','Generated Drills','Battle & Mastery','Meta & Reflection','Campaigns & Competition']['ABCDE'.indexOf(layer)]}</h1></div>`+layers[layer].map((x,i)=>`<button class="mechanic family family-${layer==='A'?'read':layer==='B'?'explain':layer==='C'?'fluency':layer==='D'?'meta':'plan'}" style="width:100%" data-unit="${x}"><small>${layer}-${i+1} · ${i<2?'READY':'ASSEMBLY'}</small><b>${x}</b><small>${layer==='A'?'untimed · sealed future':layer==='B'?'seeded fact bank':layer==='C'?'gated by mastery':layer==='D'?'reflection, no punishment':'same seed / historical context'}</small></button>`).join('');units.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>openUnit(b.dataset.unit))}document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-layer]').forEach(x=>x.classList.remove('active'));b.classList.add('active');layer=b.dataset.layer;render()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-stage]').forEach(x=>x.classList.remove('active'));b.classList.add('active');stage=b.dataset.stage;renderMix()});function openUnit(name){let chosen='',o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal"><div class="top"><div><div class="label">LAYER ${layer} · ${stage}</div><div class="big">${name}</div></div><button class="tab" data-x>×</button></div><div class="chart" id="unitChart"></div><div class="card"><div class="row"><span>Decisions</span><b>${stage==='AB'?'1–2':stage==='CE'?'3–4':stage==='FH'?'4–6':'5–7'}</b></div><div class="row"><span>Sources</span><b>${stage==='AB'?'1–2':stage==='CE'?'2–3':'3–4'}</b></div><div class="row"><span>Timer in core</span><b>never</b></div></div><div class="grid two"><button class="choice" data-a>WAIT</button><button class="choice" data-a>NO TRADE</button></div><button class="primary" data-seal>Seal decision</button></div>`;document.body.append(o);SA.chart(o.querySelector('#unitChart'),name.length,false);o.querySelector('[data-x]').onclick=()=>o.remove();o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{chosen=b.textContent;o.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('selected',x===b))});o.querySelector('[data-seal]').onclick=()=>{if(!chosen)return SA.toast('Сначала выберите решение');SA.toast('Решение запечатано · '+chosen);setTimeout(()=>o.remove(),500)}};renderMix();render();
</script><script src="platform/route-registry.js"></script><script src="platform/arena-audit.js"></script><script src="platform/arena-platform.js"></script></body></html>
