<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Mechanics Atlas</title><link rel="stylesheet" href="shared.css"><body><main class="shell"><section class="screen"><div class="top"><div class="brand">MECHANICS ATLAS</div><span class="badge">M01–M36</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП 03 · INDEPENDENT FIXTURES</div><h1>Каждая механика — отдельный тест.</h1><p>Novice introduction и advanced transfer запускаются из одной карточки.</p></div><div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="0">0–20</button><button class="tab" data-filter="21">21–60</button><button class="tab" data-filter="61">61–99</button></div><div class="menu-grid" id="menu"></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script src="mechanic-runtime.js"></script><script>function draw(f='all'){menu.innerHTML=SA_DATA.mechanics.map(m=>{let hide=f==='0'?m.level>20:f==='21'?(m.level<21||m.level>60):f==='61'?m.level<61:false;return `<button class="mechanic ${hide?'hidden':''}" data-id="${m.id}"><small>${m.id} · LEVEL ${m.level}</small><b>${m.icon} ${m.name}</b><small>${m.action}</small></button>`}).join('');menu.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>MECHANIC_RUNTIME.open(b.dataset.id))}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)});draw();</script></body></html>
