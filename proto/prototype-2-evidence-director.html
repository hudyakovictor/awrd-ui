<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Evidence Director</title><link rel="stylesheet" href="shared.css"><body><main class="shell"><section class="screen" data-view="case"><div class="top"><div class="brand">EVIDENCE DIRECTOR</div><div class="hud"><span class="badge" id="step">1/6</span></div></div><div class="progress" id="bar" style="--p:16%"><i></i></div><div class="hero"><div class="eyebrow" id="kicker">CASE · CONTEXT</div><h1 id="title">Пробой на фоне новости</h1><p id="sub">Будущее скрыто до sealed decision. Соберите доказательства, затем риск-план.</p></div><div id="stage"></div><div class="cta"><button class="primary" id="go">Открыть источники</button><button class="secondary hidden" id="reset">Начать заново</button></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script>let phase=0,evidence=[],decision='',conf=55;const phases=['CONTEXT','SOURCE STACK','EVIDENCE DECK','RISK PLAN','SEALED REVEAL','DQI DEBRIEF'];function render(){step.textContent=(phase+1)+'/6';bar.style.setProperty('--p',((phase+1)/6*100)+'%');kicker.textContent='CASE · '+phases[phase];go.disabled=false;reset.classList.add('hidden');if(phase===0){title.textContent='Пробой на фоне новости';sub.textContent='Будущее скрыто до sealed decision. Соберите доказательства, затем риск-план.';stage.innerHTML='<div class="chart" id="c"></div><div class="card"><div class="label">Видимо до t0</div><p>Цена тестирует максимум. Публикация появилась 18 минут назад.</p></div>';SA.chart(c,7,false);go.textContent='Открыть источники'}if(phase===1){title.textContent='Источник не равен сигналу';sub.textContent='Отметьте 1–3 наблюдаемых факта.';stage.innerHTML='<div class="grid">'+[['price','PRICE','Закрытие выше уровня: нет'],['volume','VOLUME','Объём +22%, но затухает'],['news','NEWS','Автор заинтересован в охвате'],['social','SOCIAL','Рост обсуждений ≠ подтверждение']].map(x=>`<button class="source ${evidence.includes(x[0])?'selected':''}" data-e="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')+'</div>';stage.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let x=b.dataset.e;evidence=evidence.includes(x)?evidence.filter(v=>v!==x):evidence.length<3?[...evidence,x]:evidence;b.classList.toggle('selected',evidence.includes(x));go.disabled=!evidence.length});go.disabled=!evidence.length;go.textContent='Собрать Evidence Deck'}if(phase===2){title.textContent='Evidence Deck';sub.textContent='Карты — язык решения, не бонусы силы.';stage.innerHTML='<div class="stack">'+evidence.map(x=>`<span class="token on">${x.toUpperCase()} · факт</span>`).join('')+'</div><div class="card"><div class="label">Выберите карту процесса</div><div class="grid"><button class="choice" data-d="wait">WAIT FOR RETEST</button><button class="choice" data-d="enter">ENTER NOW</button><button class="choice" data-d="none">NO TRADE</button></div></div>';stage.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{decision=b.dataset.d;stage.querySelectorAll('[data-d]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');go.disabled=false});go.disabled=!decision;go.textContent='Зафиксировать риск-план'}if(phase===3){title.textContent='Risk-first plan lock';sub.textContent='Без инвалидации решение не запечатывается.';stage.innerHTML='<div class="card"><label>Инвалидация<textarea id="inv" placeholder="Что отменит гипотезу?"></textarea></label></div><div class="card"><div class="row"><span>Уверенность</span><b id="cv">'+conf+'%</b></div><input id="cr" type="range" min="20" max="95" value="'+conf+'"></div>';inv.oninput=()=>go.disabled=inv.value.trim().length<12;cr.oninput=()=>{conf=+cr.value;cv.textContent=conf+'%'};go.disabled=true;go.textContent='Запечатать решение'}if(phase===4){title.textContent='Будущее раскрыто';sub.textContent='Цена вернулась под уровень. Outcome отрицательный, но процесс оценивается отдельно.';stage.innerHTML='<div class="chart" id="r"></div><div class="card bad"><b>Fake Breakout Phantom</b><p>Ретест не удержан. Вход сейчас нарушил бы инвалидацию.</p></div>';SA.chart(r,7,true);go.textContent='Открыть DQI'}if(phase===5){let good=decision==='wait'||decision==='none';title.textContent='DQI '+(good?'91':'54');sub.textContent=good?'Хороший процесс выдержал плохой outcome.':'Удачный outcome не повысил бы плохой процесс.';stage.innerHTML=`<div class="card"><div class="score">${good?'91':'54'}</div><div class="label">Decision Quality Index</div></div><div class="card good"><b>Blocker clinic</b><p>${good?'Transfer gap: повторить на другом активе через 3 дня.':'Discipline gap: no-trade contrast cases, без боя и таймера.'}</p></div><div class="card"><div class="row"><span>Next review</span><b>+3 дня</b></div></div>`;go.classList.add('hidden');reset.classList.remove('hidden')}}go.onclick=()=>{SA.event('phase_completed',{phase:phases[phase]});phase=Math.min(5,phase+1);render()};reset.onclick=()=>{phase=0;evidence=[];decision='';go.classList.remove('hidden');render()};render();</script></body></html>
