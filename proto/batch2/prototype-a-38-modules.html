<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — 38 Modules</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">38 MODULES</div><span class="badge">AUTONOMOUS</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП A · FIVE FAMILIES</div><h1>Форма проверки не равна навыку.</h1><p>Каждый модуль запускается отдельно и проходит ПОКАЗ → ПРОБА → ПРАВИЛО → ПЕРВЫЙ БОЙ.</p></div><div class="search"><label class="sr-only" for="moduleSearch">Найти модуль</label><input id="moduleSearch" type="text" placeholder="Найти модуль или код"></div><div class="toolbar"><span class="count" id="moduleCount"></span></div><div class="tabs"><button class="tab active" data-f="all">Все</button><button class="tab" data-f="core">Core</button><button class="tab" data-f="alley">Alley</button><button class="tab" data-f="tournament">Tournament</button></div><div id="list"></div></section></main><script src="batch-data.js"></script><script src="shared.js"></script><script>
const famClass=x=>'family-'+x.toLowerCase();let activeFilter='all',query='';
function draw(){let rows=BATCH_DATA.modules38.filter(x=>(activeFilter==='all'||x.zone===activeFilter)&&(!query||(x.code+' '+x.name).toLowerCase().includes(query)));moduleCount.textContent=rows.length+' из '+BATCH_DATA.modules38.length;list.innerHTML=rows.length?rows.map((x,i)=>{let st=JSON.parse(localStorage.getItem('sa38:'+x.code)||'{}').taught?'mastered':i%9===0?'rusting':'new';return `<button class="mechanic card family ${famClass(x.family)}" style="width:100%" data-code="${x.code}"><div class="module-row"><span class="glyph ${st}">${x.glyph}</span><div><div class="label">${x.code} · УРОВЕНЬ ${x.level}</div><b>${x.name}</b><small>${x.decisions} реш. · давление ${x.pressure} · ${x.zone}</small></div></div></button>`}).join(''):'<div class="empty">Ничего не найдено. Попробуйте код или часть названия.</div>';list.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>openModule(b.dataset.code))}
moduleSearch.oninput=()=>{query=moduleSearch.value.trim().toLowerCase();draw()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.f;draw()});
function openModule(code){let m=BATCH_DATA.modules38.find(x=>x.code===code),step=0,selected=false,o=document.createElement('div');o.className='overlay';function paint(){let titles=['ПОКАЗ + ПРАВИЛО','БЕЗОПАСНАЯ ПРОБА','ПЕРВЫЙ БОЙ'],body=step===0?`<div class="ghost-hand">${m.glyph} →</div><div class="card good"><div class="label">ПРАВИЛО</div><b>${m.family==='ЧИТАТЬ'?'Сначала пойми, что видишь.':m.family==='ЗАЩИЩАТЬ'?'Назови предел до действия.':m.family==='РЕШАТЬ'?'Назови решение и его цену.':'Объясни процесс, не себя.'}</b></div>`:step===1?`<div class="grid two"><button class="choice" data-answer>Факт</button><button class="choice" data-answer>Шум</button></div><p class="inline-hint">Выбор не оценивается. После тапа сразу перейдём к бою.</p>`:`<div class="card soft"><div class="row"><span>Решений</span><b>${Math.max(1,m.decisions-1)}</b></div><div class="row"><span>Давление</span><b>${Math.max(1,m.pressure-1)}</b></div></div><div class="grid two"><button class="choice" data-fight="ok">WAIT</button><button class="choice" data-fight="ok">NO TRADE</button><button class="choice" data-fight="bad">CHASE</button></div>`;o.innerHTML=`<div class="modal family ${famClass(m.family)}"><div class="top"><div><div class="label">${m.code} · ${titles[step]}</div><div class="big">${m.glyph} ${m.name}</div></div><button class="tab" data-close aria-label="Закрыть">×</button></div><div class="stepper" style="grid-template-columns:repeat(3,1fr)">${[0,1,2].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${body}<button class="primary" data-next ${step>0&&!selected?'disabled':''}>${step===0?'Попробовать':step===1?'К первому бою':'Завершить'}</button>${step===0?'<button class="secondary" data-skip>Я знаю правило · к пробе</button>':''}</div>`;o.querySelector('[data-close]').onclick=()=>o.remove();o.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{selected=true;b.classList.add('selected');setTimeout(()=>{step=2;selected=false;paint()},180)});o.querySelectorAll('[data-fight]').forEach(b=>b.onclick=()=>{selected=true;o.querySelectorAll('[data-fight]').forEach(x=>x.classList.toggle('selected',x===b));o.querySelector('[data-next]').disabled=false});let skip=o.querySelector('[data-skip]');if(skip)skip.onclick=()=>{step=1;selected=false;paint()};o.querySelector('[data-next]').onclick=()=>{if(step<2){step++;selected=false;paint()}else{localStorage.setItem('sa38:'+m.code,JSON.stringify({taught:true,firstFightAt:new Date().toISOString()}));SA.toast(m.code+' освоена');o.remove();draw()}}}paint();document.body.append(o)}draw();
</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
