<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — 46 Mechanics Bench</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">MECHANICS BENCH</div><span class="badge">46 ROUTES</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП B · TASK ENVELOPE</div><h1>Один знак в пяти местах.</h1><p>READ, PLAN, GUARD и META. Каждый код открывается как самостоятельный маршрут.</p></div><div class="search"><label class="sr-only" for="benchSearch">Найти механику</label><input id="benchSearch" type="text" placeholder="Найти механику или код"></div><div class="toolbar"><span class="count" id="benchCount"></span><a class="tab" href="../route-index.html">Все маршруты</a></div><div class="tabs"><button class="tab active" data-f="all">Все</button><button class="tab" data-f="READ">READ</button><button class="tab" data-f="PLAN">PLAN</button><button class="tab" data-f="GUARD">GUARD</button><button class="tab" data-f="META">META</button></div><div class="menu-grid" id="bench"></div></section></main><script src="batch-data.js"></script><script src="shared.js"></script><script>
const glyph={READ:'◐',PLAN:'◆',GUARD:'▲',META:'●'},fc=x=>'family-'+x.toLowerCase();let activeFilter='all',query='';
function render(){let rows=BATCH_DATA.mechanics46.filter(x=>(activeFilter==='all'||x.family===activeFilter)&&(!query||(x.code+' '+x.name).toLowerCase().includes(query)));benchCount.textContent=rows.length+' из '+BATCH_DATA.mechanics46.length;bench.innerHTML=rows.length?rows.map(x=>`<button class="mechanic family ${fc(x.family)}" data-code="${x.code}"><small>${x.code} · ${x.status} · L${x.level}</small><b>${glyph[x.family]} ${x.name}</b><small>${x.decisions} реш. · ${x.sources} ист.</small></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Нет совпадений</div>';bench.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>openBench(b.dataset.code))}
benchSearch.oninput=()=>{query=benchSearch.value.trim().toLowerCase();render()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.f;render()});
function openBench(code){let m=BATCH_DATA.mechanics46.find(x=>x.code===code),stage=0,selected=false,o=document.createElement('div');o.className='overlay';function paint(){let body=stage===0?`<div class="ghost-hand">${glyph[m.family]} →</div><div class="card good"><div class="label">ГОТОВЫЙ ПРИМЕР</div><b>Смотрите на подсвеченный признак, затем выбирайте действие.</b></div>`:`<div class="chart" id="benchChart"></div><div class="grid two"><button class="choice" data-action>WAIT</button><button class="choice" data-action>NO TRADE</button></div><label class="card soft">Уверенность до ответа<input type="range" min="50" max="95" value="65"></label>`;o.innerHTML=`<div class="modal family ${fc(m.family)}"><div class="top"><div><div class="label">${m.code} · ${stage?'ВАШ ХОД':'ПОКАЗ'}</div><div class="big">${glyph[m.family]} ${m.name}</div></div><button class="tab" data-close aria-label="Закрыть">×</button></div><div class="stepper" style="grid-template-columns:repeat(2,1fr)">${[0,1].map(i=>`<i class="${i<=stage?'on':''}"></i>`).join('')}</div>${body}<div aria-live="polite" data-feedback></div><button class="primary" data-next ${stage&& !selected?'disabled':''}>${stage?'Проверить':'Перейти к заданию'}</button>${!stage?`<a class="secondary" style="display:grid;place-items:center;text-decoration:none" href="../lab/mechanics46/${m.code.toLowerCase()}/">Открыть полный маршрут</a>`:''}</div>`;if(stage===1)SA.chart(o.querySelector('#benchChart'),m.code.charCodeAt(0),false);o.querySelector('[data-close]').onclick=()=>o.remove();o.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{selected=true;o.querySelectorAll('[data-action]').forEach(x=>x.classList.toggle('selected',x===b));o.querySelector('[data-next]').disabled=false});o.querySelector('[data-next]').onclick=()=>{if(!stage){stage=1;selected=false;paint()}else{let e={code:m.code,correct:true,latency:0,confidence:.65,sources_on_screen:m.sources,decisions_count:m.decisions,slots_used:Math.min(2,m.sources),redundant_slots:0,chunk_id:null,context_id:'ctx-'+m.code.toLowerCase()+'-01',rule_applied:true,failure_class:null};localStorage.setItem('sa46:last',JSON.stringify(e));o.querySelector('[data-feedback]').innerHTML='<div class="card good"><b>✓ Проверка пройдена</b><p class="meta">Телеметрия записана. Можно закрыть окно.</p></div>';o.querySelector('[data-next]').textContent='Готово';o.querySelector('[data-next]').onclick=()=>o.remove()}}}paint();document.body.append(o)}render();
</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
