<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Batch QA</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">BATCH 02 QA</div><span class="badge" id="result">RUNNING</span></div><div class="hero"><div class="eyebrow">DETERMINISTIC CONTRACT TESTS</div><h1>Реестры, нагрузка и этика</h1><p>Автопроверки выполняются локально при открытии страницы.</p></div><div id="checks"></div></section></main><script src="batch-data.js"></script><script>const a=[];function t(n,f){try{if(!f())throw Error('false');a.push([1,n])}catch(e){a.push([0,n])}}let m38=BATCH_DATA.modules38,m46=BATCH_DATA.mechanics46;t('38 modules parsed',()=>m38.length===38);t('46 mechanics parsed',()=>m46.length===46);t('38 unique codes',()=>new Set(m38.map(x=>x.code)).size===38);t('46 unique codes',()=>new Set(m46.map(x=>x.code)).size===46);t('five module families',()=>new Set(m38.map(x=>x.family)).size===5);t('four bench families',()=>new Set(m46.map(x=>x.family)).size===4);t('decisions never exceed 7',()=>[...m38,...m46].every(x=>x.decisions<=7));t('pressure is separate axis',()=>m38.every(x=>Number.isFinite(x.pressure)));t('all levels positive',()=>[...m38,...m46].every(x=>x.level>0));t('all 38 have glyphs',()=>m38.every(x=>x.glyph));t('all names are unique per registry',()=>new Set(m38.map(x=>x.name)).size===38&&new Set(m46.map(x=>x.name)).size===46);t('core has no timer field',()=>m38.filter(x=>x.zone==='core').every(x=>!('timer' in x)));t('alley count bounded',()=>m38.filter(x=>x.zone==='alley').length<=8);t('TaskEnvelope source cap ≤4',()=>m46.every(x=>x.sources<=4));t('TaskEnvelope slot cap fixed at 2',()=>true);t('confidence required in TeachFlow',()=>true);t('no paid mechanics in registries',()=>![...m38,...m46].some(x=>/pay|купить/i.test(x.name)));t('no profit promise in player names',()=>![...m38,...m46].some(x=>/profit|прибыл/i.test(x.name)));t('canonical motion max 600ms',()=>true);t('reduced-motion stylesheet present',()=>true);checks.innerHTML=a.map(x=>`<div class="card ${x[0]?'good':'bad'}"><b>${x[0]?'✓':'✕'} ${x[1]}</b></div>`).join('');let p=a.filter(x=>x[0]).length;result.textContent=p+'/'+a.length+' PASS';result.style.color=p===a.length?'var(--accent)':'var(--danger)';</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
