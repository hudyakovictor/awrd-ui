<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Skill Tree</title><link rel="stylesheet" href="shared.css"><style>.skill-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}.skill-glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#0a1b24;border:1px solid var(--line)}.mini-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}.mini-bars i{height:5px;border-radius:4px;background:#233d48}.mini-bars i.on{background:var(--accent)}</style><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">SKILL TREE</div><span class="badge" id="mastery">0/40</span></div><div class="hero"><div class="eyebrow">OBSERVABLE MASTERY</div><h1>Уровень — это доказательство.</h1><p>Recognition, Application, Transfer, Explanation и Stability считаются отдельно.</p></div><div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="due">Due</button><button class="tab" data-filter="risk">Risk</button><button class="tab" data-filter="research">Research</button></div><div id="tree"></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script>let p=SA_ENGINE.restore();function render(f='all'){let now=Date.now(),rows=SA_DATA.skillNodes.filter(n=>f==='all'||(f==='due'&&(!p.cards[n.name].nextReviewAt||new Date(p.cards[n.name].nextReviewAt)<=now))||n.domain===f);tree.innerHTML=rows.map((n,i)=>{let s=p.cards[n.name],vals=[s.recognition,s.application,s.transfer,s.explanation,s.stability],status=SA_ENGINE.mastered(s)?'MASTERED':s.attempts?'TRAINING':'NEW';return `<div class="card skill-row"><div class="skill-glyph">${i+1}</div><div><b>${n.name}</b><div class="label">${n.domain} · ${status}</div><div class="mini-bars">${vals.map(v=>`<i class="${v>=.75?'on':''}"></i>`).join('')}</div></div><span class="badge">${s.attempts}</span></div>`}).join('');mastery.textContent=Object.values(p.cards).filter(SA_ENGINE.mastered).length+'/40'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render();</script></body></html>
