<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — 120 Factor Readiness</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="group.css"><link rel="stylesheet" href="platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">120 FACTORS</div><span class="badge" id="score">—</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП 09 · READINESS BENCH</div><h1>Полнота ТЗ ≠ готовность продукта.</h1><p>Переключайтесь между покрытием спецификации и фактической реализацией стендов.</p></div><div class="tabs"><button class="tab active" data-mode="spec">ТЗ coverage</button><button class="tab" data-mode="build">Build status</button></div><div class="card"><div class="row"><span>Pass</span><b class="delta" id="passN"></b></div><div class="row"><span>Partial</span><b class="warn" id="partialN"></b></div><div class="row"><span>External evidence</span><b id="externalN"></b></div><div class="progress" id="scoreBar"><i></i></div></div><div class="search"><label class="sr-only" for="factorSearch">Найти фактор</label><input id="factorSearch" type="text" placeholder="Найти фактор или номер"></div><div class="tabs" id="statusTabs"><button class="tab active" data-status="all">Все статусы</button><button class="tab" data-status="partial">Только риски</button><button class="tab" data-status="external">Внешние</button></div><div class="tabs" id="cats"></div><div class="toolbar"><span class="count" id="factorCount"></span></div><div id="factors"></div></section></main><script src="readiness-data.js"></script><script src="evidence-manifest.js"></script><script>
let mode='spec',cat='all',statusFilter='all',query='';const externalBuild=new Set([12,14,15,16,17,18,19,20,39,47,57,58,59,60,65,66,87,96,100,106,108,110,112,116,118]);const passBuild=new Set([1,2,3,4,8,10,21,22,23,24,26,27,30,31,32,33,34,35,36,40,44,50,51,55,56,61,62,63,64,67,70,73,74,86,88,91,92,93,94,95,97,98,99,101,102,103,104,105,107,109,111,113,117,119,120]);function status(id){if(mode==='spec')return [47,60,89,114].includes(id)?'partial':'pass';let e=EVIDENCE.find(x=>x.id===id);return e?e.buildStatus:(externalBuild.has(id)?'external':passBuild.has(id)?'pass':'partial')}function render(){let rows=READINESS.map(x=>({...x,status:status(x.id)})),p=rows.filter(x=>x.status==='pass').length,q=rows.filter(x=>x.status==='partial').length,e=rows.filter(x=>x.status==='external').length;passN.textContent=p;partialN.textContent=q;externalN.textContent=e;let pct=mode==='spec'?97:Math.round((p+q*.5)/1.2);score.textContent=pct+'/100';scoreBar.style.setProperty('--p',pct+'%');let cs=['all',...new Set(READINESS.map(x=>x.category))];cats.innerHTML=cs.map(x=>`<button class="tab ${x===cat?'active':''}" data-cat="${x}">${x==='all'?'Все категории':x}</button>`).join('');cats.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});let shown=rows.filter(x=>(cat==='all'||x.category===cat)&&(statusFilter==='all'||x.status===statusFilter)&&(!query||(x.id+' '+x.factor+' '+x.check).toLowerCase().includes(query)));factorCount.textContent=shown.length+' из '+rows.length;factors.innerHTML=shown.length?shown.map(x=>`<div class="card factor status-${x.status}"><div class="row"><b>${x.id}. ${x.factor}</b><span class="badge">${x.status}</span></div><small>${x.check}</small></div>`).join(''):'<div class="empty">Нет факторов по выбранным условиям.</div>'}factorSearch.oninput=()=>{query=factorSearch.value.trim().toLowerCase();render()};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-status]').forEach(x=>x.classList.remove('active'));b.classList.add('active');statusFilter=b.dataset.status;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;cat='all';statusFilter='all';render()});render();
</script><script src="platform/route-registry.js"></script><script src="platform/arena-audit.js"></script><script src="platform/arena-platform.js"></script></body></html>
