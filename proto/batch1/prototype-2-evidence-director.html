<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Evidence Director</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen" data-view="case"><div class="top"><div class="brand">EVIDENCE DIRECTOR</div><div class="hud"><span class="badge" id="step">1/6</span></div></div><div class="progress" id="bar" style="--p:16%"><i></i></div><div class="hero"><div class="eyebrow" id="kicker">CASE · CONTEXT</div><h1 id="title">Пробой на фоне новости</h1><p id="sub">Будущее скрыто до sealed decision. Соберите доказательства, затем риск-план.</p></div><div id="stage"></div><div class="cta"><button class="primary" id="go">Открыть источники</button><button class="secondary hidden" id="reset">Начать заново</button></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script>let phase=0,evidence=[],decision='',conf=55;const phases=['СИТУАЦИЯ + УЛИКИ','РЕШЕНИЕ + РИСК','РАСКРЫТИЕ','РАЗБОР'];function render(){step.textContent=(phase+1)+'/4';bar.style.setProperty('--p',((phase+1)/4*100)+'%');kicker.textContent='CASE · '+phases[phase];go.disabled=false;go.classList.remove('hidden');reset.classList.add('hidden');if(phase===0){title.textContent='Пробой на фоне новости';sub.textContent='Будущее скрыто. Выберите до трёх наблюдаемых фактов.';stage.innerHTML='<div class="chart" id="c"></div><div class="grid">'+[['price','PRICE','Закрытие выше уровня: нет'],['volume','VOLUME','Объём +22%, но затухает'],['news','NEWS','Автор заинтересован в охвате'],['social','SOCIAL','Рост обсуждений ≠ подтверждение']].map(x=>`<button class="source ${evidence.includes(x[0])?'selected':''}" data-e="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')+'</div>';SA.chart(c,7,false);stage.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let x=b.dataset.e;evidence=evidence.includes(x)?evidence.filter(v=>v!==x):evidence.length<3?[...evidence,x]:evidence;render()});go.disabled=!evidence.length;go.textContent=evidence.length?'Продолжить · '+evidence.length+' факт.':'Выберите хотя бы один факт'}if(phase===1){title.textContent='Решение и предел — вместе';sub.textContent='Выберите действие, назовите инвалидацию и уверенность.';stage.innerHTML='<div class="stack">'+evidence.map(x=>`<span class="token on">${x.toUpperCase()}</span>`).join('')+`</div><div class="grid"><button class="choice ${decision==='wait'?'selected':''}" data-d="wait">WAIT FOR RETEST</button><button class="choice ${decision==='none'?'selected':''}" data-d="none">NO TRADE</button><button class="choice ${decision==='enter'?'selected':''}" data-d="enter">ENTER NOW</button></div><label class="card">Инвалидация<textarea id="inv" placeholder="Что отменит гипотезу?"></textarea></label><label class="card soft"><span class="row"><span>Уверенность</span><b id="cv">${conf}%</b></span><input id="cr" type="range" min="20" max="95" value="${conf}"></label>`;stage.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{decision=b.dataset.d;stage.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('selected',x===b));validate()});cr.oninput=()=>{conf=+cr.value;cv.textContent=conf+'%'};inv.oninput=validate;function validate(){go.disabled=!decision||inv.value.trim().length<12}go.disabled=true;go.textContent='Запечатать и раскрыть'}if(phase===2){title.textContent='Будущее раскрыто';sub.textContent='Цена вернулась под уровень. Outcome и качество процесса разделены.';stage.innerHTML='<div class="chart" id="r"></div><div class="card bad"><b>Fake Breakout Phantom</b><p>Ретест не удержан. Вход сейчас нарушил бы инвалидацию.</p></div>';SA.chart(r,7,true);go.textContent='Посмотреть разбор'}if(phase===3){let good=decision==='wait'||decision==='none';title.textContent='DQI '+(good?'91':'54');sub.textContent=good?'Хороший процесс выдержал плохой outcome.':'Удачный outcome не повысил бы плохой процесс.';stage.innerHTML=`<div class="card"><div class="score">${good?'91':'54'}</div><div class="label">Decision Quality Index</div></div><div class="card good"><b>Следующее действие</b><p>${good?'Повторить на другом активе через 3 дня.':'Пройти no-trade contrast без боя и таймера.'}</p></div>`;go.classList.add('hidden');reset.classList.remove('hidden')}}go.onclick=()=>{SA.event('phase_completed',{phase:phases[phase]});phase=Math.min(3,phase+1);render();window.scrollTo({top:0,behavior:'smooth'})};reset.onclick=()=>{phase=0;evidence=[];decision='';go.classList.remove('hidden');render()};render();</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
