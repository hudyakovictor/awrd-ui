<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Scenario Runner</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">SCENARIO RUNTIME</div><span class="badge" id="counter">1/6</span></div><div class="progress" id="progress" style="--p:16%"><i></i></div><div id="app"></div><div class="cta"><button class="primary" id="advance">Продолжить</button><button class="secondary hidden" id="restart">Сбросить fixture</button></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script src="mechanic-runtime.js"></script><script>
const phases=['Context','Inspect','Act','Consequence','Debrief','Continue'];let id=(location.hash.slice(1)||'M01').toUpperCase(),m=SA_DATA.mechanics.find(x=>x.id===id)||SA_DATA.mechanics[0],key='sa:scenario:'+m.id,saved=JSON.parse(localStorage.getItem(key)||'{}'),phase=saved.phase||0,advanced=!!saved.advanced,actState=null,actRoot=null,started=Date.now();const seed=1700+parseInt(m.id.slice(1)),regimes=['trend','range','volatile','event'],frames=['15m','1h','4h'];
function save(){localStorage.setItem(key,JSON.stringify({phase,advanced,updatedAt:new Date().toISOString()}))}function render(){counter.textContent=(phase+1)+'/6';progress.style.setProperty('--p',((phase+1)/6*100)+'%');advance.disabled=false;restart.classList.add('hidden');let head=`<div class="hero"><div class="eyebrow">${m.id} · LEVEL ${m.level} · ${phases[phase].toUpperCase()}</div><h1>${m.icon} ${m.name}</h1><p>${m.why}</p></div>`;
 if(phase===0){app.innerHTML=head+`<div class="card"><div class="row"><span>Regime</span><b>${regimes[seed%4]}</b></div><div class="row"><span>Timeframe</span><b>${frames[seed%3]}</b></div></div><div class="card soft"><b>Один вопрос</b><p>Как применить ${m.cards[0]} до раскрытия будущего?</p></div><div class="tabs"><button class="tab ${!advanced?'active':''}" data-mode="0">Novice</button><button class="tab ${advanced?'active':''}" data-mode="1">Advanced transfer</button></div>`;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{advanced=b.dataset.mode==='1';save();render()});advance.textContent='Inspect'}
 if(phase===1){app.innerHTML=head+`<div class="chart" id="scenarioChart"></div><div class="grid"><button class="source"><b>PRICE</b><small>observable · before t0</small></button><button class="source"><b>VOLUME</b><small>${advanced?'contradicting':'supporting'} · before t0</small></button>${advanced?'<button class="source"><b>NEWS</b><small>incentive unknown · weak</small></button>':''}</div><p class="callout">Будущих свечей нет в DOM до commit.</p>`;SA.chart(scenarioChart,seed,false);advance.textContent='К действию'}
 if(phase===2){app.innerHTML=head+`<div class="card soft"><div class="label">${advanced?'ADVANCED · NAMES HIDDEN':'SAFE ATTEMPT · UNTAMED'}</div><p>${m.action}. Сначала действие, затем reveal.</p></div><div id="actRoot">${MECHANIC_RUNTIME.widget(m,advanced)}</div><div id="actFeedback" aria-live="polite"></div>`;actRoot=document.getElementById('actRoot');actState=MECHANIC_RUNTIME.bind(actRoot,m,advanced);advance.textContent='Зафиксировать';}
 if(phase===3){app.innerHTML=head+`<div class="chart" id="revealChart"></div><div class="card ${parseInt(m.id.slice(1))%3?'good':'bad'}"><b>${parseInt(m.id.slice(1))%3?'Процесс выдержан':'Обнаружен process leak'}</b><p>Следствие раскрыто после фиксации. Outcome не переписывает качество решения.</p></div>`;SA.chart(revealChart,seed,true);advance.textContent='Открыть debrief'}
 if(phase===4){let player=SA_ENGINE.restore(),card=player.cards[m.cards[0]],riskError=m.id==='M07'&&parseInt(m.id.slice(1))%3===0,updated=SA_ENGINE.updateCard(card,{correct:!riskError,application:true,transfer:advanced,explanation:advanced?.82:.7,confidence:.68,riskError}),g=SA_ENGINE.gap(updated,{riskError});player.cards[m.cards[0]]=updated;SA_ENGINE.persist(player);app.innerHTML=head+`<div class="card"><div class="row"><span>${m.cards[0]}</span><b>${SA_ENGINE.mastered(updated)?'MASTERED':'IN PROGRESS'}</b></div><div class="label">R ${updated.recognition.toFixed(2)} · A ${updated.application.toFixed(2)} · T ${updated.transfer.toFixed(2)} · X ${updated.explanation.toFixed(2)} · S ${updated.stability.toFixed(2)}</div></div><div class="card good"><b>${g}</b><p>${SA_ENGINE.practiceFor(g)}</p></div><div class="card"><div class="row"><span>Next review</span><b>${updated.nextReviewAt.slice(0,10)}</b></div></div>`;advance.textContent='Завершить'}
 if(phase===5){app.innerHTML=head+`<div class="score">${88+(seed%8)}</div><div class="label">PROCESS QUALITY</div><div class="card good"><b>Fixture complete</b><p>State, analytics, replay seed and review interval saved.</p></div><div class="grid"><a class="secondary" style="display:grid;place-items:center;text-decoration:none" href="prototype-3-mechanics-atlas.html">Следующая механика</a><a class="secondary" style="display:grid;place-items:center;text-decoration:none" href="skill-tree.html">Skill Tree</a></div>`;advance.classList.add('hidden');restart.classList.remove('hidden')}
}
advance.onclick=()=>{if(phase===2&&!MECHANIC_RUNTIME.validate(actRoot,m,actState)){actFeedback.innerHTML='<div class="card bad"><b>Завершите действие</b><p class="meta">Acceptance проверяется до reveal.</p></div>';return}SA_ENGINE.event(phases[phase]==='Act'?'scenario_committed':'phase_viewed',{scenarioId:'scenario-'+m.id.toLowerCase(),level:m.level,chapter:m.level<10?'A':m.level<50?'B':'H',cardIds:m.cards,phase:phases[phase].toLowerCase(),latencyMs:Date.now()-started,hintsUsed:0,response:{advanced,seed}});phase=Math.min(5,phase+1);save();render()};restart.onclick=()=>{localStorage.removeItem(key);phase=0;advance.classList.remove('hidden');render()};render();
</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
