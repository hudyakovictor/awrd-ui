<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena Canon</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><a class="tab" href="index.html">←</a><div class="brand">CANON REGISTRY</div><span class="badge">40 + 40</span></div><div class="tabs"><button class="tab active" data-tab="cards">Skill Cards</button><button class="tab" data-tab="entities">Entities</button></div><div id="list"></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script>function render(k='cards'){if(k==='cards')list.innerHTML=SA_DATA.skillNodes.map((x,i)=>`<div class="card"><div class="row"><div><div class="label">${x.id} · ${x.domain}</div><b>${x.name}</b></div><span class="badge">R/A/T/X/S</span></div></div>`).join('');else list.innerHTML=SA_DATA.entityDefs.map((x,i)=>`<div class="card"><div class="row"><div><div class="label">${x.id} · ${x.trigger}</div><b>${x.name}</b></div><button class="tab" data-i="${i}">Tiers</button></div><p class="meta">${x.primaryCards[0]} · ${x.secondaryCards.join(' · ')}</p></div>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let e=SA_ENGINE.entityEncounter(+b.dataset.i,'one');SA.toast(e.name+' · Tier I · hints off')})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.tab)});render();</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
