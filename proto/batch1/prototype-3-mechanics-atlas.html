<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Mechanics Atlas</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen"><div class="top"><div class="brand">MECHANICS ATLAS</div><span class="badge">M01–M36</span></div><div class="hero"><div class="eyebrow">ПРОТОТИП 03 · INDEPENDENT FIXTURES</div><h1>Каждая механика — отдельный тест.</h1><p>Novice introduction и advanced transfer запускаются из одной карточки.</p></div><div class="search"><label class="sr-only" for="atlasSearch">Найти механику</label><input id="atlasSearch" type="text" placeholder="Найти механику или M-код"></div><div class="toolbar"><span class="count" id="atlasCount"></span><a class="tab" href="../route-index.html">Маршруты</a></div><div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="0">0–20</button><button class="tab" data-filter="21">21–60</button><button class="tab" data-filter="61">61–99</button></div><div class="menu-grid" id="menu"></div></section></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script src="mechanic-runtime.js"></script><script>let filter='all',query='';function draw(){let rows=SA_DATA.mechanics.filter(m=>{let level=filter==='0'?m.level<=20:filter==='21'?m.level>=21&&m.level<=60:filter==='61'?m.level>=61:true;return level&&(!query||(m.id+' '+m.name+' '+m.action).toLowerCase().includes(query))});atlasCount.textContent=rows.length+' из '+SA_DATA.mechanics.length;menu.innerHTML=rows.length?rows.map(m=>`<button class="mechanic" data-id="${m.id}"><small>${m.id} · УРОВЕНЬ ${m.level}</small><b>${m.icon} ${m.name}</b><small>${m.action}</small></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Нет совпадений</div>';menu.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>MECHANIC_RUNTIME.open(b.dataset.id))}atlasSearch.oninput=()=>{query=atlasSearch.value.trim().toLowerCase();draw()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;draw()});draw();</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
