<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Arena — Neon City</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="../platform/arena-platform.css"><body><main class="shell"><section class="screen" data-view="city"><div class="top"><div class="brand">SIGNAL CITY</div><div class="hud"><span class="badge">⚡ 5/5</span><span class="badge">R 82</span></div></div><div class="hero"><div class="eyebrow">MARKET MOOD · CAUTION</div><h1>Город отражает режим рынка.</h1><p>Здания — разделы. Атмосфера информирует, но не даёт buy/sell сигнал.</p></div><div class="city"><div class="sky"></div><button class="building b1" data-place="academy">Университет<small>Academy</small></button><button class="building b2" data-place="arena">Колизей<small>Arena</small></button><button class="building b3" data-place="lab">Лаборатория<small>Evidence</small></button><div class="street"></div></div><div class="card"><div class="row"><span>Fear & Greed</span><b class="warn">23 · страх</b></div><p class="meta">Туман усиливает осторожность; награды и сложность не меняются.</p></div></section><section class="screen hidden" data-view="mission"><div class="top"><button class="tab" id="cityBack">← Город</button><div class="brand">ARENA CASE</div><span class="badge" id="missionStep">1/3</span></div><div id="mission"></div><div class="cta"><button class="primary" id="missionGo">Далее</button></div></section><nav class="nav"><button class="active">Город</button><button>Академия</button><button>Арена</button><button>Журнал</button><button>Профиль</button></nav></main><script src="data-model.js"></script><script src="learning-engine.js"></script><script src="shared.js"></script><script>let m=0,ap=5,selected=[];document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{m=0;renderMission();SA.show('mission')});cityBack.onclick=()=>SA.show('city');function renderMission(){missionStep.textContent=(m+1)+'/3';if(m===0){mission.innerHTML='<div class="hero"><div class="eyebrow">1 · CONTEXT</div><h1>Цена тестирует максимум.</h1><p>Актив, дата и Entity скрыты до sealed commit.</p></div><div class="chart" id="cityChart"></div><div class="card"><b>Режим: высокая волатильность</b><p class="meta">Сначала наблюдаем факты.</p></div>';SA.chart(cityChart,12,false);missionGo.textContent='К доказательствам'}if(m===1){mission.innerHTML=`<div class="hero"><div class="eyebrow">2 · EVIDENCE</div><h1>Очки внимания</h1><p>Осталось <b id="apn">${ap}</b>. Выберите, что действительно нужно.</p></div><div class="ap">${[0,1,2,3,4].map((x,i)=>`<i class="${i>=ap?'off':''}"></i>`).join('')}</div><div class="grid" id="ev">${[['volume',1],['funding',1],['on-chain',2],['social',1]].map(x=>`<button class="source" data-src="${x[0]}" data-cost="${x[1]}"><b>${x[0].toUpperCase()}</b><small>${x[1]} attention</small></button>`).join('')}</div>`;ev.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{let c=+b.dataset.cost,s=b.dataset.src;if(selected.includes(s)){selected=selected.filter(x=>x!==s);ap+=c;b.classList.remove('selected')}else if(ap>=c){selected.push(s);ap-=c;b.classList.add('selected')}else SA.toast('Недостаточно внимания');renderMission()});missionGo.textContent='К решению';missionGo.disabled=!selected.length}if(m===2){mission.innerHTML='<div class="hero"><div class="eyebrow">3 · DECISION</div><h1>Запечатайте план</h1><p>Long / Short / Wait / No Trade равноправны.</p></div><div class="grid two" id="acts"><button class="choice" data-a>WAIT</button><button class="choice" data-a>NO TRADE</button><button class="choice" data-a>LONG</button><button class="choice" data-a>SHORT</button></div><div class="card"><div class="label">Process shield</div><input aria-label="Risk cap" type="range" min="1" max="4" value="1"></div>';missionGo.textContent='Hold to seal';missionGo.disabled=true;acts.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{acts.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');missionGo.disabled=false})}}missionGo.onclick=()=>{if(m<2){m++;renderMission()}else{SA.event('scenario_committed',{attention:selected});let o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><div class="label">PROCESS SCORE</div><div class="score">88</div><h2>Риск сохранён</h2><p class="meta">Chest roll disclosed: 38%. Награда — только косметика, без силы и защиты ответа.</p><div class="card good"><b>Получено: City rain theme</b><p>Косметическое оформление города.</p></div><button class="primary" data-x>Вернуться в город</button></div>';document.body.append(o);o.querySelector('[data-x]').onclick=()=>{o.remove();SA.show('city')}}};</script><script src="../platform/route-registry.js"></script><script src="../platform/arena-audit.js"></script><script src="../platform/arena-platform.js"></script></body></html>
